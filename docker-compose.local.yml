# Standalone local HTTP stack. Do not combine with docker-compose.yml.
name: foodbridge-local

services:
  mongodb:
    image: mongo:latest
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: foodbridge_local
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { quit(rs.status().myState === 1 ? 0 : 1); } catch (e) { if (e.code === 94) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); quit(1); } throw e; }"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/foodbridge_local?replicaSet=rs0
      JWT_SECRET: foodbridge-local-testing-only-not-for-production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "0.0.0.0:${FOODBRIDGE_LOCAL_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
