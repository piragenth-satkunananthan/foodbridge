name: FoodBridge CI/CD Pipeline

on:
  push:
    branches: [ develop, main, production, 'feature/**' ]
  pull_request:
    branches: [ develop, main, production ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  backend-tests:
    name: Backend Security, DB & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run all backend unit and isolated HTTP regression tests
        run: npm run test:all --prefix backend

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Test Exports and Build Production Bundle (Vite)
        run: |
          cd frontend
          npm test
          npm run build

  deploy-to-ec2:
    name: Continuous Deployment to AWS EC2
    needs: [backend-tests, frontend-build]
    if: (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Deploying FoodBridge to AWS EC2 (${{ github.ref_name }})..."
            cd ~/foodbridge
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            docker compose up -d --build
            docker builder prune -f || true
            docker image prune -f || true
            echo "✅ Container deployment finished! Checking health:"
            docker compose ps
            sleep 4
            curl -s http://localhost:5000/api/health || true

