services:
  mongodb:
    image: mongo:latest
    container_name: foodbridge-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: foodbridge
    volumes:
      - foodbridge-mongo-data:/data/db
    networks:
      - foodbridge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodbridge-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/foodbridge
      JWT_SECRET: ${JWT_SECRET:-foodbridge_enterprise_production_jwt_secret_2026}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://54.234.233.124}
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - foodbridge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodbridge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - foodbridge-network

volumes:
  foodbridge-mongo-data:
    driver: local

networks:
  foodbridge-network:
    driver: bridge
