services:
  mongodb:
    image: mongo:latest
    container_name: foodbridge-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: foodbridge
    volumes:
      - foodbridge-mongo-data:/data/db
    networks:
      - foodbridge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodbridge-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/foodbridge
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - foodbridge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodbridge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - foodbridge-network

  caddy:
    image: caddy:2
    container_name: foodbridge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - foodbridge-network

volumes:
  foodbridge-mongo-data:
    driver: local
  caddy_data:
  caddy_config:

networks:
  foodbridge-network:
    driver: bridge
